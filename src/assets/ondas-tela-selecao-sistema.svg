      <stop offset="0.822015" stop-color="#00D8D8" stop-opacity="0.5"/>
      <stop offset="0.894231" stop-color="#009797" stop-opacity="0.3"/>
      <stop offset="0.966346" stop-color="#006A6A" stop-opacity="0.1"/>

server {
    listen 80;
    server_name SERVER_NAME;

    # /sigla/assets/x.js -> /assets/x.js (arquivos reais no root do nginx)
    # /sigla/... -> /... -> SPA (index.html)
    location /sigla/ {
        rewrite ^/sigla/(.*)$ /$1 last;
    }

    location = /sigla {
        return 301 /sigla/;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }
}
